<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#1e3a5f"/>

  <!-- Subtle texture: thin horizontal rule -->
  <line x1="80" y1="340" x2="1120" y2="340" stroke="#2d5a8e" stroke-width="1"/>

  <!-- Eyebrow -->
  <text
    x="80" y="230"
    font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif"
    font-size="22"
    font-weight="600"
    letter-spacing="4"
    fill="#7aa8d4"
    text-transform="uppercase">NEBRASKA · PUBLIC RECORDS PROJECT</text>

  <!-- Wordmark -->
  <text
    x="80" y="308"
    font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif"
    font-size="72"
    font-weight="700"
    letter-spacing="-1"
    fill="#ffffff">ALPR Nebraska</text>

  <!-- Tagline -->
  <text
    x="80" y="390"
    font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="400"
    fill="#a8c4e0">Tracking public records on automated license plate reader</text>
  <text
    x="80" y="424"
    font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="400"
    fill="#a8c4e0">systems in Nebraska.</text>

  <!-- Domain -->
  <text
    x="80" y="530"
    font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif"
    font-size="20"
    font-weight="500"
    fill="#4a7aaa">alprnebraska.org</text>
</svg>
